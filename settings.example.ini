# TV DINNER settings -- copy to settings.ini (untracked, per machine).
# Missing file or keys = the defaults shown here.

[playback]
# How playback draws the picture: normal (mpv), ascii or pixel. ASCII and
# PIXEL draw it themselves (mpv plays the audio) and need ffmpeg; made for
# an XGA (1024x768) 2x2 CRT video wall. Also changeable on the ABOUT screen
# (BACK from the guide, UP/DOWN to the VIDEO MODE row, LEFT/RIGHT), which
# saves it back to this file.
#   ascii: colored text characters on black, in a Linux console font --
#     with the 8x8 VGA font a 128x96 character grid at 1024x768.
#   pixel: blocky pixels, a limited palette and ordered dithering, like an
#     old computer or game console.
video_mode = normal
# ASCII mode color boost: 1.0 = each character keeps its cell's natural
# color; higher pushes pale tints toward their pure hue (grays stay white).
# 3.0 = vivid. 0 = all white.
ascii_saturation = 3.0
# ASCII mode font: any Linux console font in /usr/share/consolefonts (name
# without .psf.gz) or a full path. Bigger font = bigger letters, fewer of
# them. At 1024x768: Lat15-VGA8 (8x8) = 128x96 characters, Lat15-VGA14
# (8x14) = 128x54, Lat15-TerminusBold18x10 = 102x42,
# Lat15-TerminusBold24x12 = 85x32. List them: ls /usr/share/consolefonts
ascii_font = Lat15-VGA8
# ASCII mode leading: pixel rows trimmed from the blank space between lines
# of text (more lines fit, less black). Only blank rows are cut, and at
# least 1 black row always stays between lines. Lat15-VGA14 has 4 blank
# rows: 2 = 8x12 cells (128x64 at 1024x768), 3 = 8x11 (128x69).
ascii_line_trim = 0
# PIXEL mode palette: NES (50 colors), PICO-8, EGA, C64 (16 each), GAME BOY,
# CGA (4 each). Also changeable on the ABOUT screen's PALETTE row.
pixel_palette = NES
# PIXEL mode resolution, WIDTHxHEIGHT. 256x192 = 4x4 blocks at 1024x768,
# 128x96 = 8x8; sizes that don't divide the screen evenly still work
# (nearest-neighbor stretch, so some blocks are a pixel wider).
pixel_size = 256x192
