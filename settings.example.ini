# TV DINNER settings -- copy to settings.ini (untracked, per machine).
# Missing file or keys = the defaults shown here.

[playback]
# Play video as colored ASCII characters on black instead of normal video:
# mpv plays the audio, TV DINNER draws the picture as text in the Linux
# console's 8x8 VGA font. Made for an XGA (1024x768) 2x2 CRT video wall,
# where it's a 128x96 character grid; at 720x480 it's 90x60. Needs ffmpeg.
ascii_mode = no
